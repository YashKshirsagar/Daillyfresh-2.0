{% extends 'base.html' %}
{% load static %}

{% block title %}My Orders | Daillyfresh{% endblock %}

{% block content %}
<style>
  .order-card {
    transition: all 0.3s ease;
  }
  
  .order-card:hover {
    box-shadow: 0 8px 24px rgba(22, 163, 74, 0.12);
  }

  .status-badge {
    display: inline-block;
    padding: 0.5rem 1rem;
    border-radius: 9999px;
    font-weight: 600;
    font-size: 0.875rem;
  }

  .status-pending { background: #fef3c7; color: #92400e; }
  .status-completed { background: #dcfce7; color: #0a2f15; }

  .filter-btn { padding: 0.5rem 1.25rem; border-radius: 9999px; font-weight: 600; font-size: 0.875rem; border: 2px solid #e5e7eb; color: #6b7280; transition: all 0.2s; cursor: pointer; }
  .filter-btn:hover { border-color: #16a34a; color: #16a34a; }
  .filter-btn.active { background: #16a34a; color: white; border-color: #16a34a; }
</style>

<div class="bg-white" style="padding-top: 100px;">
  <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-12 md:py-16">
    <!-- Header -->
    <div class="mb-12">
      <h1 class="text-4xl md:text-5xl font-bold mb-4 text-[#0a2f15]">My Orders</h1>
      <p class="text-gray-600 text-lg">View and manage your order history</p>
    </div>

    <!-- Orders Container -->
    <div
      x-data="{ 
        orders: [], 
        loading: true,
        showEmpty: false,
        activeFilter: 'all',
        init() {
          this.loadOrders();
        },
        async loadOrders() {
          try {
            let url = '/api/orders/';
            if (this.activeFilter !== 'all') {
              url += '?status=' + encodeURIComponent(this.activeFilter);
            }
            const response = await fetch(url);
            const data = await response.json();
            this.orders = data.orders;
            this.showEmpty = this.orders.length === 0;
            this.loading = false;
          } catch (error) {
            console.error('Error loading orders:', error);
            this.loading = false;
          }
        },
        setFilter(filter) {
          this.activeFilter = filter;
          this.loading = true;
          this.loadOrders();
        },
        getCsrfToken() {
          const cookieValue = document.cookie
            .split('; ')
            .find((row) => row.startsWith('csrftoken='));
          return cookieValue ? decodeURIComponent(cookieValue.split('=')[1]) : '';
        },
        async repeatOrder(orderId) {
          if (!confirm('Repeat this order?')) return;
          
          try {
            const response = await fetch('/api/repeat-order/', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': this.getCsrfToken()
              },
              body: JSON.stringify({ order_id: orderId })
            });
            const data = await response.json();
            if (data.success) {
              Alpine.store('cart').replace(data.cart_items || []);
              sessionStorage.setItem('repeat_order_notice', data.message || 'Items added to cart.');
              if (data.skipped_items && data.skipped_items.length) {
                sessionStorage.setItem('repeat_order_warning', 'Some unavailable items were skipped while rebuilding your cart.');
              } else {
                sessionStorage.removeItem('repeat_order_warning');
              }
              window.location.href = '{% url "cart_page" %}';
            } else {
              alert('Error: ' + (data.message || 'Failed to repeat order'));
            }
          } catch (error) {
            alert('Error: ' + error.message);
          }
        },
        getStatusClass(status) {
          const normalized = status.toLowerCase().replace(/ /g, '-');
          return `status-${normalized}`;
        }
      }"
      x-init="init()"
    >
      <!-- Filter Tabs -->
      <div class="mb-8 flex flex-wrap gap-3">
        <button
          class="filter-btn"
          :class="{ 'active': activeFilter === 'all' }"
          @click="setFilter('all')">
          All Orders
        </button>
        <button
          class="filter-btn"
          :class="{ 'active': activeFilter === 'Pending' }"
          @click="setFilter('Pending')">
          Pending
        </button>
        <button
          class="filter-btn"
          :class="{ 'active': activeFilter === 'Completed' }"
          @click="setFilter('Completed')">
          Completed
        </button>
      </div>

      <!-- Loading State -->
      <div x-show="loading" class="text-center py-16">
        <div class="inline-block">
          <i class="ri-loader-4-line text-5xl text-[#16a34a] animate-spin mb-4"></i>
          <p class="text-gray-600 text-lg">Loading your orders...</p>
        </div>
      </div>

      <!-- Empty State -->
      <div x-show="showEmpty && !loading" class="text-center py-16">
        <i class="ri-shopping-cart-line text-6xl text-gray-400 mb-4"></i>
        <h3 class="text-2xl font-semibold text-gray-800 mb-2">No Orders Yet</h3>
        <p class="text-gray-600 mb-6">Start shopping to see your orders here</p>
        <a href="/" class="inline-flex items-center gap-2 px-6 py-3 bg-[#16a34a] text-white rounded-full font-bold hover:bg-[#84cc16] transition-all">
          <i class="ri-shopping-bag-line"></i> Continue Shopping
        </a>
      </div>

      <!-- Orders List -->
      <div x-show="!loading && !showEmpty" class="space-y-6">
        <template x-for="order in orders" :key="order.id">
          <div class="order-card border border-gray-200 rounded-xl overflow-hidden bg-white">
            <!-- Order Header -->
            <div class="bg-gradient-to-r from-[#f0fdf4] to-[#dcfce7] px-6 py-4 border-b border-gray-200">
              <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div>
                  <h3 class="text-xl font-bold text-[#0a2f15]">
                    Order <span x-text="`#${order.user_order_number}`"></span>
                  </h3>
                  <p class="text-sm text-gray-600 mt-1" x-text="`Ordered on ${order.created_at}`"></p>
                  <div class="mt-3 flex flex-wrap gap-2 text-xs font-semibold">
                    <span class="inline-flex items-center rounded-full bg-white px-3 py-1 text-[#0a2f15] border border-[#bbf7d0]">
                      Customer ID: <span class="ml-1" x-text="order.customer_id || 'N/A'"></span>
                    </span>
                    <span class="inline-flex items-center rounded-full bg-white px-3 py-1 text-[#0a2f15] border border-[#bbf7d0]">
                      Order ID: <span class="ml-1" x-text="order.order_ref || order.id"></span>
                    </span>
                  </div>
                </div>
                <div class="flex items-center gap-3">
                  <span
                    :class="getStatusClass(order.status)"
                    class="status-badge"
                    x-text="order.status"
                  ></span>
                </div>
              </div>
            </div>

            <!-- Order Items -->
            <div class="px-6 py-4 border-b border-gray-200">
              <h4 class="font-semibold text-gray-800 mb-3">Items</h4>
              <div class="space-y-2">
                <template x-for="item in order.items" :key="item.id">
                  <div class="flex items-center justify-between text-sm">
                    <div>
                      <p class="font-medium text-gray-900" x-text="item.product_name"></p>
                      <p class="text-gray-600">
                        Qty: <span x-text="item.quantity"></span> × ₹<span x-text="item.price.toFixed(2)"></span>
                      </p>
                    </div>
                    <p class="font-semibold text-gray-900">₹<span x-text="item.total.toFixed(2)"></span></p>
                  </div>
                </template>
              </div>
            </div>

            <!-- Shipping Address -->
            <div x-show="order.shipping_address" class="px-6 py-4 border-b border-gray-200">
              <h4 class="font-semibold text-gray-800 mb-3">Delivery Address</h4>
              <div class="bg-gray-50 p-3 rounded-lg text-sm">
                <p class="font-medium text-gray-900" x-text="order.shipping_address?.full_name"></p>
                <p class="text-gray-600 mt-1" x-text="order.shipping_address?.phone"></p>
                <p class="text-gray-600" x-text="order.shipping_address?.address"></p>
                <p class="text-gray-600" x-text="order.shipping_address?.city"></p>
              </div>
            </div>

            <!-- Order Summary -->
            <div class="px-6 py-4 bg-gray-50">
              <div class="space-y-2 mb-4">
                <div class="flex justify-between text-sm">
                  <span class="text-gray-600">Subtotal</span>
                  <span class="font-medium">₹<span x-text="order.subtotal.toFixed(2)"></span></span>
                </div>
                <div class="flex justify-between text-sm">
                  <span class="text-gray-600">Delivery Fee</span>
                  <span class="font-medium">₹<span x-text="order.delivery_fee.toFixed(2)"></span></span>
                </div>
                <div x-show="order.discount_amount > 0" class="flex justify-between text-sm text-green-600">
                  <span>Discount</span>
                  <span class="font-medium">-₹<span x-text="order.discount_amount.toFixed(2)"></span></span>
                </div>
                <div x-show="order.coupon_code" class="flex justify-between text-sm text-green-600">
                  <span>Coupon (<span x-text="order.coupon_code"></span>)</span>
                  <span class="font-medium">Applied</span>
                </div>
                <div class="border-t border-gray-300 pt-2 flex justify-between">
                  <span class="font-bold text-gray-900">Total Amount</span>
                  <span class="font-bold text-lg text-[#16a34a]">₹<span x-text="order.total_amount.toFixed(2)"></span></span>
                </div>
                <div class="flex justify-between text-sm mt-2">
                  <span class="text-gray-600">Payment</span>
                  <span
                    :class="order.payment_mode === 'Prepaid' ? 'text-green-600 font-semibold' : 'text-gray-700 font-medium'"
                    x-text="order.payment_mode === 'Prepaid' ? '✓ Paid Online' : 'Cash on Delivery'"
                  ></span>
                </div>
              </div>

              <!-- Action Button -->
              <button
                @click="repeatOrder(order.id)"
                class="w-full px-6 py-3 bg-[#16a34a] text-white rounded-lg font-bold hover:bg-[#128a3d] transition-all transform hover:-translate-y-1 flex items-center justify-center gap-2"
              >
                <i class="ri-refresh-line"></i> Repeat Order
              </button>
            </div>
          </div>
        </template>
      </div>
    </div>

    <!-- Back to Home -->
    <div class="mt-12 pt-8 border-t border-gray-200">
      <a href="/" class="inline-flex items-center gap-2 text-[#16a34a] font-bold hover:translate-x-1 transition-transform">
        <i class="ri-arrow-left-line"></i> Back to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
